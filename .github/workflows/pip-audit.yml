name: Dependency audit
# Checks every pinned version in requirements.txt against the PyPI/OSV
# advisory databases without installing anything, so Windows-only packages
# (pywin32, WMI, winshell) can be audited on Linux.
on:
  pull_request:
    paths:
      - 'requirements.txt'
      - '.github/workflows/pip-audit.yml'
  push:
    branches: [main]
    paths:
      - 'requirements.txt'
      - '.github/workflows/pip-audit.yml'
  schedule:
    - cron: '41 3 * * 0'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pip-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned auditor
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Prepare requirement list
        # `av` is a direct wheel URL (SpectrumQT's PyAV build). Audit it as the
        # upstream PyAV release it is built from, read from the wheel file name.
        run: |
          sed -E 's#^av @ .*/av-([0-9][0-9.]*)-.*\.whl$#av==\1#' requirements.txt > "$RUNNER_TEMP/requirements-audit.txt"
          if grep -n ' @ ' "$RUNNER_TEMP/requirements-audit.txt"; then
            echo '::error::Unhandled direct URL requirement; extend the filter above.'
            exit 1
          fi
      - name: Audit pinned versions
        run: >-
          pip-audit --disable-pip --no-deps --progress-spinner off
          --requirement "$RUNNER_TEMP/requirements-audit.txt"
          --desc on --format markdown --output "$RUNNER_TEMP/pip-audit.md"
      - name: Publish report
        if: always()
        run: |
          if [ -s "$RUNNER_TEMP/pip-audit.md" ]; then
            { echo '## pip-audit'; echo; cat "$RUNNER_TEMP/pip-audit.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
