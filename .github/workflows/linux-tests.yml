name: Linux tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: linux-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install cryptography psutil
      - name: Run Linux-runnable tests
        env:
          PYTHONPATH: src/xxmi_launcher
        run: python -m unittest discover -s tests -v
