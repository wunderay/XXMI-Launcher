name: Linux tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: linux-tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unittest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt
      # Pillow (pinned as in requirements.txt) lets the image-cache tests run here
      - run: python -m pip install cryptography psutil pillow==12.3.0
      - name: Run Linux-runnable tests
        env:
          PYTHONPATH: src/xxmi_launcher
        run: python -m unittest discover -s tests -v
