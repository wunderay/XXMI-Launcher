name: Dependency review
# Blocks pull requests that add dependencies (Python requirements or GitHub
# Actions) with known high-severity advisories. Uses the dependency graph,
# which is free for public repositories.
on:
  pull_request:
    paths:
      - 'requirements.txt'
      - '.github/workflows/**'
permissions:
  contents: read
concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
