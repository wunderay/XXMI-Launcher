name: Workflow lint
# actionlint catches syntax, expression and shell errors; zizmor catches
# security problems such as unpinned actions, template injection and
# credential persistence.
on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Install pinned linters
        # actionlint-py ships the official actionlint binary (1.7.12) as a wheel.
        run: python -m pip install --disable-pip-version-check actionlint-py==1.7.12.25 zizmor==1.32.0
      - name: actionlint
        run: actionlint -color
      - name: zizmor
        run: zizmor --offline --format github .
