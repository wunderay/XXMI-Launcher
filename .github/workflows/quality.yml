name: Quality
# Cheap Linux-only static checks. The launcher itself only runs on Windows, so
# these checks never import the GUI; they parse and lint the sources.
on:
  pull_request:
    paths:
      - '**.py'
      - '.github/workflows/quality.yml'
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/quality.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint-and-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          # The release build requires CPython 3.12 (tools/PreparedLoading/build-launcher.ps1).
          python-version: '3.12'
      - name: Install pinned linter
        run: python -m pip install --disable-pip-version-check ruff==0.17.5
      - name: Ruff (real errors only)
        # E9 syntax errors, F63 invalid comparisons, F7 misplaced statements,
        # F82 undefined names. widgets.py uses string forward references to
        # UIFrame, which is defined in a module it cannot import (circular).
        run: >-
          ruff check --no-cache --output-format=github --target-version py312
          --select E9,F63,F7,F82
          --per-file-ignores 'src/xxmi_launcher/gui/classes/widgets.py:F821'
          .
      - name: Byte-compile every module with Python 3.12
        env:
          PYTHONPYCACHEPREFIX: ${{ runner.temp }}/pycache
        run: python -m compileall -q -f src tests tools
