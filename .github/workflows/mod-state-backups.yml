name: Mod backup Windows checks
# Manual only: Actions minutes are limited (Actions > this workflow > Run workflow).
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mod-state-backups-${{ github.ref }}
  cancel-in-progress: true
jobs:
  worker-tests:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install fixture dependencies
        run: python -m pip install cryptography psutil
      - name: Test snapshot engine, process guards and launcher actions
        env:
          PYTHONPATH: src/xxmi_launcher
        run: python -m unittest discover -s tests -p 'test_mod_state*.py' -v
  packaged-worker:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Build the standard launcher payload
        shell: pwsh
        run: |
          $fixtureTemp = Join-Path $env:GITHUB_WORKSPACE 'work\mod-state-temp'
          New-Item -ItemType Directory -Force $fixtureTemp | Out-Null
          $env:TEMP = $fixtureTemp
          $env:TMP = $fixtureTemp
          & ./tools/PreparedLoading/build-launcher.ps1 -OutputDirectory ./work/launcher-package
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test real settings buttons and detached packaged backup and restore
        shell: pwsh
        run: |
          $fixtureTemp = Join-Path $env:GITHUB_WORKSPACE 'work\mod-state-temp'
          $env:TEMP = $fixtureTemp
          $env:TMP = $fixtureTemp
          $env:PYTHONPATH = Join-Path $env:GITHUB_WORKSPACE 'src\xxmi_launcher'
          $env:XXMI_MOD_STATE_TEST_BUNDLE = Join-Path $env:GITHUB_WORKSPACE 'work\launcher-package\install-payload'
          $python = Join-Path $env:GITHUB_WORKSPACE 'work\launcher-package\build\venv\Scripts\python.exe'
          & $python -c 'import subprocess, sys; subprocess.run([sys.executable, "-m", "unittest", "discover", "-s", "tests", "-p", "test_launcher*.py", "-v"], check=True, timeout=240)'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }