name: Performance check
# Mandatory before merging: runs the tools/perf benchmarks on the PR's base and head
# on the same runner and fails if the head regresses any metric beyond its tolerance.
# Results go to the job summary (no artifacts). Linux only (Actions minutes are limited).
# Mark the "compare" check as required in Settings > Branches (or a ruleset) for main.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace xvfb
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Prepare base sources
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: git worktree add --detach "$RUNNER_TEMP/base" "$BASE_SHA"
      - name: Install portable dependencies of base and head
        # Everything both versions import except Windows-only packages, the Windows PyAV wheel URL
        # and the build tool; PyAV comes from PyPI for Linux.
        run: |
          # (requirements.txt has no trailing newline: separate the files explicitly)
          { cat requirements.txt; echo; cat "$RUNNER_TEMP/base/requirements.txt"; echo; } |
            grep -viE '^(pywin32|wmi|winshell|nuitka)==|^av @' | sort -u > "$RUNNER_TEMP/perf-requirements.txt"
          python -m pip install --disable-pip-version-check -r "$RUNNER_TEMP/perf-requirements.txt" av
      - name: Compare base and head
        run: python tools/perf/compare.py --base "$RUNNER_TEMP/base/src/xxmi_launcher" --head src/xxmi_launcher --runs 7
