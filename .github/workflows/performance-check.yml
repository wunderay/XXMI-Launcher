name: Performance check
# Mandatory before merging: runs the tools/perf benchmarks on the PR's base and head
# on the same runner and fails if the head regresses any metric beyond its tolerance.
# Results go to the job summary (no artifacts). Linux only (a free hosted runner on this public repository).
# Mark the "compare" check as required in Settings > Branches (or a ruleset) for main.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: performance-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install system tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq strace xvfb
          python -c "import tkinter; print('Tk', tkinter.TkVersion)"
      - name: Prepare base sources
        # A pull request is checked out as its merge commit, built on the base branch's current
        # tip; that tip (its first parent) is the base. `pull_request.base.sha` can be older.
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then base=$(git rev-parse HEAD^1); else base=$(git rev-parse origin/main); fi
          echo "Base: $base"
          echo "Base: \`$base\`" >> "$GITHUB_STEP_SUMMARY"
          git worktree add --detach "$RUNNER_TEMP/base" "$base"
      - name: Install each version's portable dependencies in its own environment
        # Each side runs with exactly its own pins, so a pull request that changes a dependency is
        # measured against the base's versions. Windows-only packages, the Windows PyAV wheel URL
        # and the build tool are left out; PyAV comes from PyPI for Linux.
        run: |
          for side in base head; do
            if [ "$side" = base ]; then tree="$RUNNER_TEMP/base"; else tree=.; fi
            python -m venv "$RUNNER_TEMP/venv-$side"
            # (requirements.txt has no trailing newline: add one before filtering)
            { cat "$tree/requirements.txt"; echo; } |
              grep -viE '^(pywin32|wmi|winshell|nuitka)==|^av @' > "$RUNNER_TEMP/requirements-$side.txt"
            "$RUNNER_TEMP/venv-$side/bin/python" -m pip install --disable-pip-version-check \
              -r "$RUNNER_TEMP/requirements-$side.txt" av==19.0.1
          done
      - name: Compare base and head
        run: >-
          python tools/perf/compare.py --base "$RUNNER_TEMP/base/src/xxmi_launcher" --head src/xxmi_launcher
          --base-python "$RUNNER_TEMP/venv-base/bin/python" --head-python "$RUNNER_TEMP/venv-head/bin/python"
          --runs 7
